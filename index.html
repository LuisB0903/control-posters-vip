<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1014" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <title>Control de Pósters · C. VIP</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo
      (function () {
        try {
          var t = localStorage.getItem("tema");
          if (!t)
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "claro"
                : "oscuro";
          document.documentElement.setAttribute("data-tema", t);
        } catch (e) {
          document.documentElement.setAttribute("data-tema", "oscuro");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
